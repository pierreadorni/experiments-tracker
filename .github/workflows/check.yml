name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install uv
        run: python -m pip install uv==0.12.3
      - name: Install locked dependencies
        run: make setup
      - name: Check source and local storage adapters
        run: make check
      - name: Run synthetic demo
        run: |
          uv run --locked experimenttracker --config .local/demo.yaml init
          uv run --locked experimenttracker --config .local/demo.yaml doctor
          uv run --locked experimenttracker --config .local/demo.yaml demo --max-seconds 60
