[project]
name = "experimenttracker"
version = "0.1.0"
description = "A durable, agent-assisted research experiment workflow on Slurm"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "httpx>=0.28,<1",
    "matplotlib>=3.10,<4",
    "tensorboard>=2.20,<3",
]

[project.scripts]
experimenttracker = "experimenttracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/experimenttracker"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
ignore = ["ASYNC109"] # subprocess timeout is enforced and the child is reaped
